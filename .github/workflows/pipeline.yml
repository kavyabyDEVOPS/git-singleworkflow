name: Complete CI-CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - staging
      - prod

  pull_request:
    branches:
      - main
      - develop
      - staging
      - prod

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # 1. CODE QUALITY
  # --------------------------------------------------
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting
        run: |
          black --check .

      - name: Run linter
        run: |
          ruff check .

      - name: Scan dependencies
        run: |
          pip-audit


  # --------------------------------------------------
  # 2. TEST MATRIX
  # --------------------------------------------------
  test-matrix:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}

    needs:
      - code-quality

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest -v


  # --------------------------------------------------
  # 3. BUILD AND PACKAGE
  # --------------------------------------------------
  build-package:
    name: Build and Package

    needs:
      - code-quality
      - test-matrix

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifact
        run: |
          mkdir -p build/artifact

          cp app.py build/artifact/
          cp -r app build/artifact/
          cp -r tests build/artifact/

          echo "Build completed successfully" > build/artifact/BUILD_INFO.txt

          cd build
          zip -r github-assignment-artifact.zip artifact

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-assignment-artifact
          path: build/github-assignment-artifact.zip
          retention-days: 7


  # --------------------------------------------------
  # 4. INTEGRATION CHECK
  # --------------------------------------------------
  integration-check:
    name: Integration Check

    needs:
      - build-package

    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-assignment-artifact
          path: downloaded

      - name: Extract artifact
        run: |
          mkdir integration
          unzip downloaded/github-assignment-artifact.zip -d integration

      - name: Run packaged application
        run: |
          cd integration/artifact
          python app.py

      - name: Run tests from artifact
        run: |
          cd integration/artifact
          python -m pip install pytest
          PYTHONPATH=. pytest -v


  # --------------------------------------------------
  # 5. DEPLOY TO STAGING
  # --------------------------------------------------
  deploy-staging:
    name: Deploy to Staging

    needs:
      - integration-check

    if: |
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/staging'
      )

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-assignment-artifact
          path: artifact

      - name: Deploy artifact to staging
        run: |
          echo "Deploying tested artifact to STAGING"
          ls -lh artifact
          echo "No rebuild is performed."


  # --------------------------------------------------
  # 6. DEPLOY TO PRODUCTION
  # --------------------------------------------------
  deploy-production:
    name: Deploy to Production

    needs:
      - integration-check

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-assignment-artifact
          path: artifact

      - name: Deploy artifact to production
        run: |
          echo "Deploying tested artifact to PRODUCTION"
          ls -lh artifact
          echo "No rebuild is performed."
